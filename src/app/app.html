<div class="app-shell">
  <app-header />

  <div class="app-shell__body">
    <app-sidebar (newTask)="openCreateTaskDialog()" />

    <main class="dashboard">

      @if (isLoading()) {
        <div class="dashboard__state">
          <mat-spinner diameter="36" />
          <p>Loading dashboard…</p>
        </div>
      } @else if (error()) {
        <div class="dashboard__state">
          <p>Something went wrong while loading the dashboard.</p>
          <button mat-stroked-button color="primary" (click)="retry()">Retry</button>
        </div>
      } @else {
        <div class="dashboard__stats-row">
          @for (stat of statistics(); track stat.id) {
            <app-stat-card [statistic]="stat" />
          }
        </div>

        <div class="dashboard__board">
          <app-kanban-column
            title="To Do"
            dotColor="#3b82f6"
            [tasks]="todoTasks()"
            (editTask)="openEditTaskDialog($event)"
            (deleteTask)="confirmDeleteTask($event)"
          />
          <app-kanban-column
            title="In Progress"
            dotColor="#f59e0b"
            [tasks]="inProgressTasks()"
            (editTask)="openEditTaskDialog($event)"
            (deleteTask)="confirmDeleteTask($event)"
          />
          <app-kanban-column
            title="Done"
            dotColor="#16a34a"
            [tasks]="doneTasks()"
            (editTask)="openEditTaskDialog($event)"
            (deleteTask)="confirmDeleteTask($event)"
          />
        </div>
      }
    </main>
  </div>
</div>
