@if (isLoading()) {
  <div class="task-board-page__state">
    <mat-spinner diameter="36" />
    <p>Loading tasks…</p>
  </div>
} @else if (error()) {
  <div class="task-board-page__state">
    <p>Something went wrong while loading tasks.</p>
    <button mat-stroked-button color="primary" (click)="retry()">Retry</button>
  </div>
} @else {
  <app-filter-bar
    [filters]="filters()"
    (filtersChange)="onFiltersChange($event)"
    (newTask)="openCreateTaskDialog()"
  />

  <div class="task-board-page__board">
    @if (showTodoColumn()) {
      <app-kanban-column
        title="To Do"
        dotColor="#3b82f6"
        [tasks]="todoTasks()"
        (editTask)="openEditTaskDialog($event)"
        (deleteTask)="confirmDeleteTask($event)"
      />
    }
    @if (showInProgressColumn()) {
      <app-kanban-column
        title="In Progress"
        dotColor="#f59e0b"
        [tasks]="inProgressTasks()"
        (editTask)="openEditTaskDialog($event)"
        (deleteTask)="confirmDeleteTask($event)"
      />
    }
    @if (showDoneColumn()) {
      <app-kanban-column
        title="Done"
        dotColor="#16a34a"
        [tasks]="doneTasks()"
        (editTask)="openEditTaskDialog($event)"
        (deleteTask)="confirmDeleteTask($event)"
      />
    }
  </div>
}
