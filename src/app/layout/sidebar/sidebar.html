<aside class="app-sidebar">
  <nav class="app-sidebar__nav">
    @for (item of navItems; track item.label) {
      @if (item.route) {
        <a
          class="app-sidebar__link"
          [routerLink]="item.route"
          routerLinkActive="app-sidebar__link--active"
          #rla="routerLinkActive"
        >
          <mat-icon [style.color]="rla.isActive ? null : item.color">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      } @else {
        <span class="app-sidebar__link app-sidebar__link--disabled" [matTooltip]="'Coming soon'">
          <mat-icon [style.color]="item.color">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </span>
      }
    }
  </nav>

  <button mat-raised-button color="primary" class="app-sidebar__new-task" (click)="newTask.emit()">
    <mat-icon>add</mat-icon>
    New Task
  </button>
</aside>
